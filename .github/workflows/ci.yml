name: Ground station CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ground-station-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy libssl-dev libssh-dev libsodium23 openssh-server openssl ninja-build
      - name: Build and test GCC Release
        run: |
          cmake -S . -B build-linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
          cmake --build build-linux-release --parallel 2
          ctest --test-dir build-linux-release --output-on-failure
          python3 -m tests.run_stage8_recovery --build build-linux-release
      - name: Build and test Clang ASan and UBSan
        run: |
          cmake -S . -B build-linux-sanitized -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGS_ENABLE_SANITIZERS=ON
          cmake --build build-linux-sanitized --parallel 2
          ctest --test-dir build-linux-sanitized --output-on-failure
          PADO_STAGE9_CORE_PROBE_TEST=build-linux-sanitized/gs_stage9_core_probe python3 -m unittest tests.test_stage9_core_probe -v
      - name: Analyze first-party C sources
        run: clang-tidy -p build-linux-sanitized -checks='clang-analyzer-*' -warnings-as-errors='*' libgs/src/exchange.c libgs/src/hash.c libgs/src/log.c libgs/src/manifest.c libgs/src/framing.c libgs/src/ipc.c libgs/src/sftp.c sim/tm_frame.c sim/fake_kari.c sim/fake_sat.c services/common/tm_sim_support.c services/common/test_tc_wire.c services/common/stage6_routes.c services/dgs-net/tle.c services/dgs-archive/catalog.c services/dgs-gs/main.c services/dgs-gs/tc_gate.c services/fds/exchange_main.c services/ros/core/main.c services/ros/core/sequence_verify.c services/ros/core/tc_workflow.c services/ros/signer/test_signer.c services/mps/core/inputs.c services/mps/core/plan_store.c services/mps/core/conflict.c services/mps/core/sequence_export.c services/mps/core/intake.c services/mps/core/fds_schedule.c services/mps/core/tc_selection.c services/webapp/core_probe.c
      - name: Fuzz external input parsers with ASan and UBSan
        run: |
          cmake -S . -B build-linux-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DGS_ENABLE_SANITIZERS=ON -DGS_BUILD_MANIFEST_FUZZER=ON -DGS_BUILD_MPS_CATALOG_FUZZER=ON -DGS_BUILD_TM_FUZZER=ON -DGS_BUILD_TLE_FUZZER=ON
          cmake --build build-linux-fuzz --parallel 2 --target gs_manifest_fuzzer gs_mps_catalog_fuzzer gs_tm_fuzzer gs_tle_fuzzer
          python3 tests/run_stage8_fuzz.py --build build-linux-fuzz
      - name: Check interface and secret rules
        run: |
          bash -n pado-gs.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/check_secrets.py --staged
      - name: Require patched Docker for isolated bridges
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(
              ['docker', 'info', '--format', '{{.ServerVersion}}'], text=True).strip()
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:\+[A-Za-z0-9.-]+)?', version)
          if not match or tuple(map(int, match.groups()[:3])) < (28, 0, 0):
              raise SystemExit(f'Docker Engine 28.0.0+ required: {version}')
          print(f'Docker Engine {version}: isolated bridge support available')
          PY
      - name: Test isolated container network
        run: |
          python3 tools/check_flows.py check
          python3 tests/container/run_network.py --build
          python3 tests/container/run_stage7_topology.py
          python3 tests/container/run_stage7_tm.py
      - name: Validate Stage 9 container packaging
        env:
          PADO_STAGE9_CERT_DIR: /tmp
        run: |
          set -euo pipefail
          mkdir -p out/mps-schedules
          trap 'docker compose -f deploy/stage9/compose.dev.yaml down --volumes --remove-orphans' EXIT
          docker compose -f deploy/stage9/compose.dev.yaml config --quiet
          docker compose -f deploy/stage9/compose.dev.yaml build
          docker compose -f deploy/stage9/compose.dev.yaml up -d --wait --no-deps ros-core-read mps-core-read
          docker compose -f deploy/stage9/compose.dev.yaml run --rm --no-deps ros-api \
            python3 -c 'from pathlib import Path; from services.webapp.core import ros_summary; assert ros_summary(Path("/run/core/core.sock"))["record_state"] == "absent"'
          docker compose -f deploy/stage9/compose.dev.yaml run --rm --no-deps mps-api \
            python3 -c 'from pathlib import Path; from services.webapp.core import mps_catalog,mps_passes; s=Path("/run/core/core.sock"); assert mps_catalog(s)["version"] == 1; assert mps_passes(s)["schedule_state"] == "absent"'
      - name: Validate Windows-to-VM HTTP Compose
        env:
          PADO_LOCAL_BIND_IP: 127.0.0.1
        run: docker compose -f deploy/stage9/compose.local.yaml config --quiet

  fds-orbit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify runner Java, Maven, and native dependencies
        run: |
          set -euo pipefail
          java -version
          javac -version
          mvn -version
          command -v unzip
          test -f /usr/include/openssl/sha.h
      - name: Fetch pinned offline physical data
        run: |
          set -euo pipefail
          mkdir -p out
          git init -q out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82
          git -C out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 \
            fetch --depth 1 https://gitlab.orekit.org/orekit/orekit-data.git \
            2422a7d06ee2cc3b5a503a47271203b0706f3e82
          git -C out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 \
            checkout --detach -q FETCH_HEAD
          test "$(git -C out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 rev-parse HEAD)" = \
            2422a7d06ee2cc3b5a503a47271203b0706f3e82
      - name: Compile and exercise FDS propagation
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f services/fds/pom.xml test-compile exec:java \
            -Dexec.mainClass=kr.ac.khu.padosat.fds.FdsSelfTest \
            -Dexec.classpathScope=test \
            "-Dexec.args=$PWD/services/fds/src/test/resources $PWD/out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 $PWD/out"
      - name: Verify synthetic SSO TLE and rolling phase
        run: |
          mvn --batch-mode --no-transfer-progress -f services/fds/pom.xml test-compile exec:java \
            -Dexec.mainClass=kr.ac.khu.padosat.fds.SyntheticTleSelfTest \
            -Dexec.classpathScope=test \
            "-Dexec.args=$PWD/out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 $PWD/out"
      - name: Verify fictional ISS display TLE refit
        run: |
          mvn --batch-mode --no-transfer-progress -f services/fds/pom.xml test-compile exec:java \
            -Dexec.mainClass=kr.ac.khu.padosat.fds.IssDisplayTleSelfTest \
            -Dexec.classpathScope=test \
            "-Dexec.args=$PWD/out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 $PWD/services/fds/demo/iss-fixed.tle $PWD/out"
          python3 -m unittest tests.test_build_iss_demo
          python3 tools/build_iss_demo.py --test-only \
            --orekit-data "$PWD/out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82" \
            --output-root "$PWD/out/iss-display-smoke" \
            --view-dir "$PWD/out/fds-iss-view-smoke"
          test -s out/fds-iss-view-smoke/orbit_view.json
      - name: Verify staged GNSS to published FDS view
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iservices/mps/core -Ilibgs/include -Ithird_party \
            tests/mps_fds_test.c services/mps/core/fds_schedule.c \
            services/mps/core/tc_selection.c services/mps/core/inputs.c \
            libgs/src/hash.c libgs/src/manifest.c third_party/cJSON.c \
            -o out/gs_mps_fds_import -lcrypto -lm
          python3 -m tests.run_fds_pipeline_smoke \
            out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82 \
            --mps-import-exe out/gs_mps_fds_import
      - name: Verify synthetic satellite TM through GNSS-fed FDS
        run: |
          python3 -m tests.run_synthetic_demo_smoke \
            out/orekit-data-2422a7d06ee2cc3b5a503a47271203b0706f3e82
      - name: Build offline synthetic demo, TM, and ROS containers
        env:
          PADO_LOCAL_BIND_IP: 127.0.0.1
        run: docker compose -f deploy/stage9/compose.local.yaml build fds-synthetic-demo sim-ground sim-satellite ros-api
      - name: Verify contact-gated simulator TM, private TC bridge, and ROS ACK
        env:
          PADO_LOCAL_BIND_IP: 127.0.0.1
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/stage9/compose.local.yaml)
          cleanup() {
            result=$?
            if (( result != 0 )); then
              "${compose[@]}" logs --tail=80 fds-synthetic-demo sim-ground sim-satellite ros-api || true
            fi
            "${compose[@]}" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          "${compose[@]}" up -d fds-synthetic-demo sim-ground sim-satellite ros-api
          truth_ready=false
          for attempt in {1..60}; do
            if "${compose[@]}" exec -T sim-ground python3 -c \
              'from pathlib import Path; assert Path("/fds-view/orbit_view.json").is_file()' \
              >/dev/null 2>&1; then
              truth_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$truth_ready" != true ]]; then
            exit 1
          fi
          # Close the virtual link briefly and verify the on-board Docker
          # volume accumulates TM before opening the CI-only contact below.
          "${compose[@]}" exec -T fds-synthetic-demo python3 - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path('/app/out/fds-truth/orbit_view.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          station = next(item for item in document['stations']
                         if item['id'] == 'yonsei' and item['band'] == 'UHF')
          station['passes'] = []
          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8',
                                           dir=path.parent, delete=False) as handle:
              temporary = Path(handle.name)
              json.dump(document, handle, separators=(',', ':'))
              handle.flush()
              os.fsync(handle.fileno())
          temporary.chmod(0o644)
          temporary.replace(path)
          PY
          sleep 7
          "${compose[@]}" exec -T sim-satellite python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('file:/state/test_tm_spool.sqlite3?mode=ro', uri=True) as db:
              queued = db.execute('SELECT COUNT(*) FROM tm_spool').fetchone()[0]
          assert queued >= 3, queued
          print('out-of-contact stored PDUs:', queued)
          PY
          # CI-only contact window in an ephemeral Docker volume. Keep the FDS
          # truth TLE and samples intact; the receiver must still validate them.
          # The real pass geometry is checked separately in the offline smoke.
          "${compose[@]}" exec -T fds-synthetic-demo python3 - <<'PY'
          import json
          import os
          import tempfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('/app/out/fds-truth/orbit_view.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc)
          start = datetime.fromisoformat(document['start_utc'].replace('Z', '+00:00'))
          end = datetime.fromisoformat(document['end_utc'].replace('Z', '+00:00'))
          aos = max(start, now - timedelta(seconds=10))
          los = min(end, now + timedelta(minutes=10))
          assert los - aos >= timedelta(minutes=8)
          station = next(item for item in document['stations']
                         if item['id'] == 'yonsei' and item['band'] == 'UHF')
          def utc(value):
              return value.isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          station['passes'] = [{'aos_utc': utc(aos), 'los_utc': utc(los)}]
          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8',
                                           dir=path.parent, delete=False) as handle:
              temporary = Path(handle.name)
              json.dump(document, handle, separators=(',', ':'))
              handle.flush()
              os.fsync(handle.fileno())
          temporary.chmod(0o644)
          temporary.replace(path)
          PY
          ready=false
          for attempt in {1..36}; do
            if "${compose[@]}" exec -T sim-ground python3 -c \
              'import json; from pathlib import Path; p=json.loads(Path("/tm-preview/test_tm_snapshot.json").read_text()); assert p["non_operational"] is True and p["attitude"] is not None and len(list(Path("/n11-inbox").glob("*.manifest.json"))) >= 1' \
              >/dev/null 2>&1; then
              if "${compose[@]}" exec -T sim-satellite python3 -c \
                'import sqlite3; db=sqlite3.connect("file:/state/test_tm_spool.sqlite3?mode=ro",uri=True); assert db.execute("SELECT COUNT(*) FROM tm_spool").fetchone()[0] <= 3' \
                >/dev/null 2>&1; then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            exit 1
          fi
          "${compose[@]}" exec -T sim-satellite python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('file:/state/test_tm_spool.sqlite3?mode=ro', uri=True) as db:
              queued = db.execute('SELECT COUNT(*) FROM tm_spool').fetchone()[0]
          assert queued <= 3, queued
          print('in-contact remaining PDUs:', queued)
          PY
          "${compose[@]}" exec -T ros-api python3 - <<'PY'
          import time
          from pathlib import Path
          from services.webapp.ros_workbench import RosDraftStore
          from services.webapp.sim_tc_dispatch import send_sim_tc

          ack = send_sim_tc(Path('/run/sim-tc/bridge.sock'), {
              'command_name': 'mm_get_mode',
              'command_sequence': 7,
              'parameters': {},
          })
          assert ack['command_id'] == 4098, ack
          assert ack['command_sequence'] == 7, ack
          assert ack['result'] == 0 and ack['reason'] == 0, ack
          assert ack['executed_at_utc_ms'] > 0, ack

          # Use the same persistent DB as the running ROS service. The service's
          # own dispatcher must claim this future AOS+offset reservation and
          # record the satellite's correlated ACK; this process only observes.
          store = RosDraftStore(Path('/state/ros-drafts.db'))
          try:
              now = int(time.time())
              aos = now + 20
              sequence = store.import_sim_handoff({
                  'schema': 'pado.sim-sequence.v1',
                  'source': 'MPS_TEST_DRAFT',
                  'non_operational': True,
                  'pass_id': 'yonsei-ci-roundtrip',
                  'station_id': 'yonsei',
                  'band': 'UHF',
                  'schedule_sha256': 'c' * 64,
                  'aos_utc_s': aos,
                  'los_utc_s': aos + 180,
                  'revision': 1,
                  'steps': [{'offset_s': 5, 'command_name': 'mm_get_mode',
                             'parameters': {}}],
              }, 'ci')
              reservation = store.reserve_sim(sequence['sha256'], 1, 'ci')
              deadline = time.monotonic() + 65
              while time.monotonic() < deadline:
                  current = next(row for row in store.list_sim_reservations()
                                 if row['id'] == reservation['id'])
                  if current['status'] == 'ACKED':
                      saved_ack = current['ack']
                      assert saved_ack['command_id'] == 4098, current
                      assert saved_ack['command_sequence'] == (
                          (reservation['id'] - 1) % 65535 + 1), current
                      assert saved_ack['result'] == 0 and saved_ack['reason'] == 0, current
                      break
                  if current['status'] not in ('SCHEDULED', 'SENDING'):
                      raise RuntimeError(f'ROS reservation did not ACK: {current}')
                  time.sleep(0.5)
              else:
                  raise TimeoutError(f'ROS dispatcher did not finish: {current}')
          finally:
              store.close()
          PY
      - name: Verify live DGS-only operator and outbound boundary
        run: python3 tests/container/run_stage9_boundary.py
