<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PADO-SAT · 로그인</title><link rel="stylesheet" href="/assets/style.css"></head>
<body data-page="login"><main class="login-wrap"><section class="login-card">
<div class="brand-mark">P<span>·</span></div><p class="eyebrow">PADO-SAT GROUND SYSTEM</p>
<h1>지상국 접속</h1><p class="muted">계정 인증 후 ROS 및 MPS 화면에 접근할 수 있습니다.</p>
<form id="login-form" autocomplete="on">
<label>계정<input id="username" name="username" autocomplete="username" required maxlength="64"></label>
<label>비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
<label>일회용 코드 <small>등록된 계정만 입력</small><input id="totp" name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
<button type="submit" class="primary">로그인</button><p id="login-error" class="form-error" role="alert" hidden></p>
</form><p class="login-note">현재 연결은 비운용 개발 기준선입니다. 실제 TC 송출 기능은 열려 있지 않습니다.</p>
</section></main><script src="/assets/app.js" defer></script></body></html>
