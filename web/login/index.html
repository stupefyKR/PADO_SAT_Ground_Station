<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PADO-SAT · 로그인</title><link rel="icon" type="image/png" href="/assets/pado-sat-badge-ec9020cb.png"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/validation-console.css"></head>
<body data-page="login">
<div class="global-clock" role="group" aria-label="현재 시각">
  <div class="global-clock-zone"><span class="global-clock-label">UTC</span><time id="utc-clock">---- -- -- --:--:--</time></div>
  <span class="global-clock-divider" aria-hidden="true"></span>
  <div class="global-clock-zone"><span class="global-clock-label">한국 시각 · KST (UTC+9)</span><time id="kst-clock">---- -- -- --:--:--</time></div>
</div>
<main class="login-wrap"><section class="login-card">
<img class="brand-mark" src="/assets/pado-sat-badge-ec9020cb.png" alt="PADO-SAT 임무 배지"><p class="eyebrow">PADO-SAT GROUND SYSTEM</p>
<h1>지상국 접속</h1><p class="muted">계정 인증 후 ROS 및 MPS 화면에 접근할 수 있습니다.</p>
<form id="login-form" autocomplete="on">
<label>계정<input id="username" name="username" autocomplete="username" required maxlength="64"></label>
<label>비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
<label>일회용 코드 <small>등록된 계정만 입력</small><input id="totp" name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
<button type="submit" class="primary">로그인</button><p id="login-error" class="form-error" role="alert" hidden></p>
</form><p class="login-note">현재 연결은 비운용 개발 기준선입니다. 실제 TC 송출 기능은 열려 있지 않습니다.</p>
</section></main><script src="/assets/app.js" defer></script><script src="/assets/validation-console.js" defer></script></body></html>
