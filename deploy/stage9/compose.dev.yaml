# Development only. The sole published port is bound to the VM loopback.
# All certificates and the private CA are supplied outside Git.
services:
  portal:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command:
      - python3
      - -m
      - services.webapp.main
      - portal
      - --bind
      - 0.0.0.0
      - --port
      - "8443"
      - --cert
      - /certs/portal.crt
      - --key
      - /certs/portal.key
      - --ca
      - /certs/ca.crt
      - --client-cert
      - /certs/portal.crt
      - --client-key
      - /certs/portal.key
      - --db
      - /state/accounts.db
      - --ros-url
      - https://ros-api:8443
      - --mps-url
      - https://mps-api:8443
      - --orbit-view
      - /fds-view/orbit_view.json
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ${PADO_STAGE9_CERT_DIR:?set certificate directory}
        target: /certs
        read_only: true
      - portal_state:/state
      - type: bind
        source: ${PADO_STAGE9_FDS_VIEW_DIR:-../../out/fds-view}
        target: /fds-view
        read_only: true
    networks: [entry, portal_ros, portal_mps]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  ros-api:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "ros", "--bind", "0.0.0.0", "--port", "8443", "--cert", "/certs/ros-api.crt", "--key", "/certs/ros-api.key", "--ca", "/certs/ca.crt", "--draft-db", "/state/ros-drafts.db", "--tm-preview", "/tm-preview/test_tm_snapshot.json"]
    depends_on:
      ros-core-read: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${PADO_STAGE9_CERT_DIR:?set certificate directory}
        target: /certs
        read_only: true
      - type: volume
        source: ros_core_socket
        target: /run/core
        read_only: true
      - ros_drafts:/state
      - type: bind
        source: ${PADO_STAGE9_ROS_TM_PREVIEW_DIR:-../../out/ros-tm-preview}
        target: /tm-preview
        read_only: true
    networks: [portal_ros]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  mps-api:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "mps", "--bind", "0.0.0.0", "--port", "8443", "--cert", "/certs/mps-api.crt", "--key", "/certs/mps-api.key", "--ca", "/certs/ca.crt", "--candidate-db", "/state/mps-candidates.db"]
    depends_on:
      mps-core-read: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${PADO_STAGE9_CERT_DIR:?set certificate directory}
        target: /certs
        read_only: true
      - type: volume
        source: mps_core_socket
        target: /run/core
        read_only: true
      - mps_candidates:/state
    networks: [portal_mps]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  ros-core-read:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["/usr/local/bin/gs_stage9_core_probe", "serve", "ros", "/run/core/core.sock", "/state/ros-tm.record"]
    volumes:
      - ros_core_socket:/run/core
      - type: volume
        source: ros_state
        target: /state
        read_only: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/core/core.sock"]
      interval: 2s
      timeout: 1s
      retries: 10
    logging: {driver: journald}
  mps-core-read:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["/usr/local/bin/gs_stage9_core_probe", "serve", "mps", "/run/core/core.sock", "/app/interfaces/command_db/commands.json", "/mps-schedules"]
    volumes:
      - mps_core_socket:/run/core
      - type: bind
        source: ${PADO_STAGE9_MPS_SCHEDULE_DIR:-../../out/mps-schedules}
        target: /mps-schedules
        read_only: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/core/core.sock"]
      interval: 2s
      timeout: 1s
      retries: 10
    logging: {driver: journald}
volumes:
  portal_state:
  ros_state:
  ros_core_socket:
  ros_drafts:
  mps_candidates:
  mps_core_socket:
networks:
  entry: {driver: bridge}
  portal_ros: {driver: bridge, internal: true}
  portal_mps: {driver: bridge, internal: true}
