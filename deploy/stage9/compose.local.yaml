# Windows operator PC -> VMware Linux server, development only.
# HTTP is bound to the VM's host-only address; subsystem APIs have no host ports.
services:
  init-token:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "init-internal-token", "--path", "/internal/token"]
    volumes: [internal_token:/internal]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  portal:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "portal", "--transport", "http", "--internal-token-file", "/internal/token", "--bind", "0.0.0.0", "--port", "8080", "--db", "/state/accounts.db", "--ros-url", "http://ros-api:8081", "--mps-url", "http://mps-api:8081", "--orbit-view", "/fds-view/orbit_view.json"]
    depends_on:
      init-token: {condition: service_completed_successfully}
    ports: ["${PADO_LOCAL_BIND_IP:-192.168.45.128}:8080:8080"]
    volumes:
      - internal_token:/internal:ro
      - portal_state:/state
      - fds_view:/fds-view:ro
    networks: [entry, portal_ros, portal_mps]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  ros-api:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "ros", "--transport", "http", "--internal-token-file", "/internal/token", "--bind", "0.0.0.0", "--port", "8081", "--core-socket", "/run/core/core.sock", "--draft-db", "/state/ros-drafts.db", "--tm-preview", "/tm-preview/test_tm_snapshot.json", "--sim-tc-socket", "/run/sim-tc/bridge.sock"]
    depends_on:
      init-token: {condition: service_completed_successfully}
      ros-core-read: {condition: service_healthy}
    volumes:
      - internal_token:/internal:ro
      - ros_core_socket:/run/core:ro
      - ros_drafts:/state
      - ros_tm_preview:/tm-preview:ro
      - sim_tc_socket:/run/sim-tc:ro
    networks: [portal_ros]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  mps-api:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["python3", "-m", "services.webapp.main", "mps", "--transport", "http", "--internal-token-file", "/internal/token", "--bind", "0.0.0.0", "--port", "8081", "--core-socket", "/run/core/core.sock", "--candidate-db", "/state/mps-candidates.db"]
    depends_on:
      init-token: {condition: service_completed_successfully}
      mps-core-read: {condition: service_healthy}
    volumes:
      - internal_token:/internal:ro
      - mps_core_socket:/run/core:ro
      - mps_candidates:/state
    networks: [portal_mps]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  ros-core-read:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["/usr/local/bin/gs_stage9_core_probe", "serve", "ros", "/run/core/core.sock", "/state/ros-tm.record"]
    volumes:
      - ros_core_socket:/run/core
      - ros_state:/state:ro
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/core/core.sock"]
      interval: 2s
      timeout: 1s
      retries: 10
    logging: {driver: journald}
  mps-core-read:
    build:
      context: ../..
      dockerfile: docker/stage9/Dockerfile
    command: ["/usr/local/bin/gs_stage9_core_probe", "serve", "mps", "/run/core/core.sock", "/app/interfaces/command_db/commands.json", "/mps-schedules"]
    volumes:
      - mps_core_socket:/run/core
      - mps_schedules:/mps-schedules:ro
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/core/core.sock"]
      interval: 2s
      timeout: 1s
      retries: 10
    logging: {driver: journald}
  fds-synthetic-demo:
    build:
      context: ../..
      dockerfile: docker/stage9/FdsDemo.Dockerfile
    depends_on:
      sim-volume-init: {condition: service_completed_successfully}
    volumes:
      - fds_runs:/app/out
      - fds_view:/app/out/fds-view
      - fds_truth:/app/out/fds-truth
      - mps_schedules:/app/out/mps-schedules
      - sim_n11_inbox:/n11-inbox:ro
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: {driver: journald}
  sim-volume-init:
    build:
      context: ../..
      dockerfile: docker/stage9/SimTm.Dockerfile
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/tm-preview", "/n11-inbox", "/fds-runs", "/fds-view", "/fds-truth", "/mps-schedules", "/sim-tc"]
    volumes:
      - ros_tm_preview:/tm-preview
      - sim_n11_inbox:/n11-inbox
      - fds_runs:/fds-runs
      - fds_view:/fds-view
      - fds_truth:/fds-truth
      - mps_schedules:/mps-schedules
      - sim_tc_socket:/sim-tc
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  sim-ground:
    build:
      context: ../..
      dockerfile: docker/stage9/SimTm.Dockerfile
    command: ["python3", "-m", "services.sim_ground.receiver", "--test-only", "--bind", "0.0.0.0", "--port", "9200", "--snapshot", "/tm-preview/test_tm_snapshot.json", "--n11-inbox", "/n11-inbox", "--limits", "/app/services/sim_ground/test_limits.json", "--tc-socket", "/run/sim-tc/bridge.sock"]
    depends_on:
      sim-volume-init: {condition: service_completed_successfully}
    volumes:
      - ros_tm_preview:/tm-preview
      - sim_n11_inbox:/n11-inbox
      - sim_tc_socket:/run/sim-tc
    networks: [sim_tm]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
  sim-satellite:
    build:
      context: ../..
      dockerfile: docker/stage9/SimTm.Dockerfile
    command: ["python3", "-m", "services.sim_sat.emulator", "--test-only", "--orbit-view", "/fds-view/orbit_view.json", "--host", "sim-ground", "--port", "9200", "--interval-seconds", "5", "--seed", "1"]
    depends_on:
      sim-ground: {condition: service_started}
      fds-synthetic-demo: {condition: service_started}
    volumes:
      - fds_truth:/fds-view:ro
    networks: [sim_tm]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    logging: {driver: journald}
volumes:
  internal_token:
  portal_state:
  ros_state:
  ros_core_socket:
  ros_drafts:
  ros_tm_preview:
  mps_core_socket:
  mps_candidates:
  mps_schedules:
  fds_view:
  fds_truth:
  fds_runs:
  sim_n11_inbox:
  sim_tc_socket:
networks:
  entry: {driver: bridge}
  portal_ros: {driver: bridge, internal: true}
  portal_mps: {driver: bridge, internal: true}
  sim_tm: {driver: bridge, internal: true}
